<!DOCTYPE html>
<html>
<head>
    <title>NbS-Projects</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const districts_map = {
            "corozal" : "Corozal",
            "orangeWalk":"Orange Walk",
            "belize":"Belize",
            "cayo":"Cayo",
            "stannCreek":"Stann Creek",
            "toledo":"Toledo"
        }

        function createExpandableSection(card, label, items) {
            if (!items || items.length === 0) return;
            var section = $('<div class="card-section"></div>');
            var mainLine = $('<p class="summary-line"></p>').text(label + ": " + items[0]);
            if (items.length > 1) {
                var extraCount = items.length - 1;
                var plusBtn = $('<span class="expand-btn"'+'data-original="'+extraCount+'" style="cursor:pointer; color:blue; margin-left:5px;">(+' + extraCount + ')</span>');
                var fullList = $('<ul class="full-list" style="display:none; margin: 5px 0 0 10px;"></ul>');
                $.each(items, function(i, item) {
                    fullList.append($('<li></li>').text(item));
                });
                plusBtn.on('click', function(e) {
                e.stopPropagation(); // Prevents bubbling if the card itself is clickable
                var willShow = !fullList.is(':visible');
                fullList.slideToggle();
                plusBtn.text(willShow ? '(-)' : '(+' + plusBtn.data('original') + ')');
                });
                mainLine.append(plusBtn);
                section.append(mainLine, fullList);
            } else {
                section.append(mainLine);
            }
            $(card).append(section);
        }
                    
        function checkRemoveElementById(id) {
            const checkRemove = document.getElementById(id)
            if(checkRemove) {
                checkRemove.remove();
            }
        }

        function addList(objectList) {
            var text_to_list = "";
            objectList.forEach((item) => {
                text_to_list = text_to_list + '<li>'+item+'</li>'
            })
            return text_to_list
        }
        
        function projectInfoTemplate(projObj) {
            var title = '<p class="info-data info-title">'+projObj.title+'</p>'

            var status = '<p class="info-data">'+projObj.status + ' '
            if (projObj.timeline.from == projObj.timeline.to) {
                status = status+  projObj.timeline.from
            } else {
                status = status+ projObj.timeline.from + '-' + projObj.timeline.to
            }
            status = status +'</p>';

            var description = '<p class="info-data">'+projObj.description+'</p>'            
            
            var imp_entity = '<h4 class="info-data">Implementation Entities:</h4><ul>'+addList(projObj.implementationEntity)+'</ul>' 
            
            var locations = '<h4 class="info-data info-loc">Locations:</h4><ul>'
            Object.entries(projObj.locations).forEach(([district,places]) => {
                if(places === undefined || places.length == 0) {
                    return;
                } else {

                    const districtName = districts_map[district] || district;

                    locations = locations + '<h5>'+districtName+'</h5><ul>'
                    places.forEach((p) => {
                        locations = locations + '<li>'+p+'</li>'
                    })
                    locations = locations + '</ul>'
                }
            })
            locations = locations + '</ul>'
            
            var intended_beneficiaries = '<h4 class="info-data">Intended beneficiaries:</h4>'+
                '<p class="info-data">'+projObj.details.beneficiaries+'</p>'
            
                var societal_challenges = '<h4 class="info-data">Societal challenges addressed:</h4><ul>'+addList(projObj.details.societalChallenges)+'</ul>' 
            var ecosystems_targeted = '<h4 class="info-data">Ecosystems targeted:</h4><ul>'+addList(projObj.details.ecosystemsTargeted)+'</ul>' 
            
            var ecosystem_svcs_enhanced = '<h4 class="info-data">Ecosystem services enhanced:</h4>'+
                '<p class="info-data">'+projObj.details.servicesEnhanced+'</p>'
            
                var climate_risks = '<h4 class="info-data">Climate risks addressed:</h4>'+
                '<p class="info-data">'+projObj.risks.climate+'</p>'
            
                var biodiversity_risks = '<h4 class="info-data">Biodiversity risks addressed:</h4>'+
                '<p class="info-data">'+projObj.risks.biodiversity+'</p>'
            
                var references = '<h4 class="info-data">Reference(s):</h4><ul>'
            projObj.references.forEach((r) => {
                references = references + '<li><a href="'+r+'" target="_blank">'+r+'</a></li>'
            })
            references = references + '</ul>'

            var html = title+ 
                status+ 
                description+ 
                imp_entity+
                locations+
                intended_beneficiaries+
                societal_challenges+
                ecosystems_targeted+
                ecosystem_svcs_enhanced+
                climate_risks+
                biodiversity_risks+
                references

            return html;
        }

        function showProjectInfo(projObj) {
            checkRemoveElementById("proj_overlay_bg")
            var proj_info_overlay_bg = document.createElement("div")
            proj_info_overlay_bg.setAttribute("id","proj_overlay_bg")
            $(proj_info_overlay_bg).on('click', function() {
                checkRemoveElementById("proj_overlay_bg")
            })
            var proj_info_overlay = document.createElement("div")
            proj_info_overlay.setAttribute("class","proj-overlay")
            proj_info_overlay.setAttribute("id","proj_overlay")
            $(proj_info_overlay).on('click', function(e) {
                e.stopPropagation();
            })
            //$.each(projObj, function(key,value) {
                // FORMAT THE PROJECT DATA HERE =========================
            var info_pane = document.createElement("div")
            info_pane.setAttribute("class","info-pane")
            info_pane.innerHTML = projectInfoTemplate(projObj)
            $(proj_info_overlay).append(info_pane);
                // ======================================================
            //})
            //console.log (projObj) // REMOVE BEFORE FINISH
            var map_area = document.getElementById("folium_map_container");
            $(map_area).append(proj_info_overlay_bg);
            $(proj_info_overlay_bg).append(proj_info_overlay);
        }


        $(document).ready(function() {
            $.getJSON('/project-data', function(data) {
                $.each(data, function(key, value){
                    var proj_card = document.createElement("div");
                    proj_card.setAttribute("id", "nbs_info_" + key);
                    proj_card.setAttribute("class", "proj_card");
                    proj_card.setAttribute("data-original", value.project_id);
                    $(proj_card).data("projectData",value);
                    $(proj_card).on('click', function() {
                        var projectData = $(this).data("projectData");
                        showProjectInfo(projectData)
                    })
                    $(proj_card).append("<p><strong>" + value.title + "</strong></p>");
                    $("#proj_card_display").append(proj_card);
                    var proj_status = document.createElement("div");
                    $(proj_status).append("<p>Status: " + value.status + "</p>"); 
                    $(proj_card).append(proj_status);
                    createExpandableSection(proj_card,"Challenges", value.details?.societalChallenges);
                    createExpandableSection(proj_card,"Ecosystems", value.details?.ecosystemsTargeted);
                });
            }).fail(function(error) {
                console.error("Error fetching data:", error);
            });
        });


        
    </script>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --accent-color: #e74c3c;
            --bg-light: #f4f4f4;
            --header:rgb(121, 166, 0, 1);

            --text-light: #f4f4f4;
            --text-dark: #2c3e50;
            --header-bg-color: rgb(51, 157, 255)
            
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #proj_card_display {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            max-width: 350px;
        }
        .proj_card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-left: 5px solid var(--primary-color); /* Accent bar for style */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .proj_card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .proj_card p {
            margin: 0 0 8px 0;
            color: #333333;
        }
        .proj_card strong {
            font-size: 1.1em;
            color: #2c3e50;
        }
        .card-section {
            font-size: 0.9em;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
        }
        .summary-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
        .expand-btn {
            font-weight: bold;
            background: #e8f4fd;
            color: #007bff !important;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        .expand-btn:hover {
            background: #d0e7ff;
        }
        .full-list {
            color: #555555;
            padding-left: 20px !important;
        }
        .full-list li {
            margin-bottom: 4px;
        }


        #sb_title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--header);
            color: white;
        }
        
        #proj_overlay_bg {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 80vw;
            height: 100vh;
            background-color: rgba(187, 187, 187, 0.8);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .proj-overlay {
            position: relative;
            margin: auto;
            padding: 0;
            width: 50%;
            top: 30px;
            max-height: 80vh;
            overflow-y: auto;
            background-color: var(--bg-light, #ffffff);
            color: var(--text-dark, #333333);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }
        .info-pane ul{
            margin-top: 0;
        }

        .info-data {
            padding: 20px;
            padding-top: 0;
            margin: 0;
        }
        .info-title {
            background-color: var(--header-bg-color);
            font-size: 36px;
            color: var(--text-light);
            margin: 0;
            margin-bottom: 20px;
        }
        .info-loc{
            padding-bottom: 5px;
        }
        ul>h5 {
            margin: 0;
            padding-bottom: 5px;
            padding-top: 5px;
        }

    </style>
</head>
<body style="display: flex; width: 100%; margin: 0;">
    <div style="margin: 0; padding:0; height: 100vh;flex: 1; overflow-y:scroll">
        <!--<div id="sb_title" style="font-size: 20px; align-items: center;"><H1 style="margin:auto;">Nature-Based Solution Projects</H1></div>-->
        <div id="proj_card_display"></div>
    </div>

    <div id="folium_map_container" style="margin: 0; padding:0; height: 100vh;flex: 4; position: relative">
        <iframe src="/static/map.html" width="100%" height="100%" style="border:none; padding:0; display: block;"></iframe>
    </div>
</body>
</html>
